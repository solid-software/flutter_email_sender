name: flutter_email_sender
description: Allows send emails from flutter using native platform functionality.
publish_to: none
version: 10.0.1
homepage: https://github.com/sidlatau/flutter_email_sender
repository: https://github.com/sidlatau/flutter_email_sender/tree/master/packages/flutter_email_sender
issue_tracker: https://github.com/sidlatau/flutter_email_sender/issues

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.8"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_email_sender_method_channel:
    path: ../flutter_email_sender_method_channel
  flutter_email_sender_platform_interface:
    path: ../flutter_email_sender_platform_interface
  flutter_email_sender_web:
    path: ../flutter_email_sender_web

dev_dependencies:
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

workspace:
  - example

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_email_sender_method_channel
      ios:
        default_package: flutter_email_sender_method_channel
      macos:
        default_package: flutter_email_sender_method_channel
      windows:
        default_package: flutter_email_sender_method_channel
      web:
        default_package: flutter_email_sender_web

topics:
  - email
  - mailto
  - attachments
  - plugin
